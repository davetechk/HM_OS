<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>HM OS — Habit Merge</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0c0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" type="image/x-icon" href="logo (2).png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0c0f;
      --surface:   #111418;
      --border:    #1e2329;
      --border-hi: #2a3240;
      --text:      #e8eaed;
      --muted:     #6b7280;
      --accent:    #22c55e;
      --accent-dim:#16a34a;
      --accent-glow: rgba(34,197,94,0.15);
      --danger:    #ef4444;
      --radius:    12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── GRID NOISE TEXTURE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 60% 50% at 50% -10%, rgba(34,197,94,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── LAYOUT ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px 36px;
      box-shadow:
        0 0 0 1px var(--border),
        0 24px 64px rgba(0,0,0,0.5),
        0 0 80px rgba(34,197,94,0.03);
      animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── LOGO ── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 36px;
    }

    .logo-img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      object-fit: cover;
      display: block;
      box-shadow: 0 0 32px rgba(34,197,94,0.25), 0 8px 24px rgba(0,0,0,0.4);
      animation: logoPulse 3.5s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 32px rgba(34,197,94,0.25), 0 8px 24px rgba(0,0,0,0.4); }
      50%       { box-shadow: 0 0 44px rgba(34,197,94,0.38), 0 8px 24px rgba(0,0,0,0.4); }
    }

    .logo-text {
      text-align: center;
    }

    .logo-text h1 {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text);
      line-height: 1;
    }

    .logo-text p {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 28px;
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      pointer-events: none;
      transition: stroke 0.2s;
    }

    input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    input::placeholder { color: #374151; }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
    }

    input:focus + svg,
    .input-wrap:focus-within svg {
      stroke: var(--accent);
    }

    /* ── USER SELECTOR ── */
    .user-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .user-btn {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .user-btn .handle {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .user-btn .role {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
    }

    .user-btn:hover,
    .user-btn.active {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--text);
    }

    .user-btn.active .role { color: var(--accent); }

    /* ── SUBMIT BUTTON ── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover {
      background: #16a34a;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(34,197,94,0.3);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-primary.loading {
      pointer-events: none;
      background: var(--accent-dim);
    }

    .btn-primary .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    .btn-primary.loading .btn-text { display: none; }
    .btn-primary.loading .spinner  { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR ── */
    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 11px 14px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      text-align: center;
    }

    .error-msg.show { display: block; animation: fadeUp 0.25s ease both; }

    /* ── FOOTER ── */
    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 11px;
      color: #374151;
      letter-spacing: 0.06em;
    }

    .footer span { color: var(--accent); opacity: 0.8; }

    /* ── STATUS BADGE ── */
    .status-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }

    .status-bar.loading { transform: scaleX(0.7); }
    .status-bar.done    { transform: scaleX(1); }

    /* ── SPRINT BADGE ── */
    .sprint-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 28px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .sprint-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── CONFIG ──
  const SUPABASE_URL = 'https://lghbbpndrgdolwrnwdke.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnaGJicG5kcmdkb2x3cm53ZGtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODg1OTksImV4cCI6MjA5NDc2NDU5OX0.oYxUvv-Jpkcis81w1a3uRgfhFQIRvSPBIP7Yg3t46zk';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON);

  // ── STATE ──
  let selectedUser = 'zidyep';

  // ── USER SELECT ──
  function selectUser(user) {
    selectedUser = user;
    document.getElementById('btnZidyep').classList.toggle('active', user === 'zidyep');
    document.getElementById('btnEbewe').classList.toggle('active',  user === 'ebewe');
    document.getElementById('secretKey').value = '';
    document.getElementById('secretKey').focus();
    hideError();
  }

  // ── LOGIN ──
  async function handleLogin() {
    const key = document.getElementById('secretKey').value.trim();
    if (!key) { showError('Enter your secret key.'); return; }

    setLoading(true);

    try {
      // Map nickname → email for Supabase auth
      const emailMap = {
        zidyep: 'zidyep@hmos.local',
        ebewe:  'ebewe@hmos.local'
      };
      const email = emailMap[selectedUser];

      const { data, error } = await db.auth.signInWithPassword({ email, password: key });

      if (error) throw error;

      // Store session context
      sessionStorage.setItem('hmos_user', selectedUser);
      sessionStorage.setItem('hmos_name', selectedUser === 'zidyep' ? 'David' : 'Abdulrahman');

      // Animate progress bar
      const bar = document.getElementById('statusBar');
      bar.classList.add('loading');
      setTimeout(() => {
        bar.classList.add('done');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 300);
      }, 400);

    } catch (err) {
      setLoading(false);
      const msg = err.message || 'Authentication failed.';
      showError(msg.includes('Invalid') ? 'Incorrect secret key. Try again.' : msg);
    }
  }

  // ── ENTER KEY ──
  document.getElementById('secretKey').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });

  // ── HELPERS ──
  function setLoading(on) {
    const btn = document.getElementById('loginBtn');
    btn.classList.toggle('loading', on);
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('errorMsg').classList.remove('show');
  }

  // ── CHECK EXISTING SESSION ──
  (async () => {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      // Already signed in — go straight to dashboard
      // (disabled for now so user can always choose their account)
      // window.location.href = 'dashboard.html';
    }
  })();
</script>
